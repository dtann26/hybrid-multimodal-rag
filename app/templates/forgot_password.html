<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG KB — Forgot Password</title>
  <meta name="description" content="Recover your password for RAG Knowledge Base System">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Include Tailwind CDN for utility styling classes to match login.html layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f0f0f',
              card: '#171717',
              border: '#262626',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-dvh flex items-center justify-center bg-[#0f0f0f] text-gray-100 antialiased font-sans">

  <div class="w-full max-w-md p-6 sm:p-8 transition-all duration-300">
    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="mb-3 animate-pulse">
        <svg class="w-12 h-12 mx-auto text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 7a2 2 0 012 2m-2 4a2 2 0 012 2m-8-3a2 2 0 11-4 0 2 2 0 014 0zM12 18a6 6 0 100-12 6 6 0 000 12z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Forgot Password</h1>
      <p class="text-gray-400 text-sm mt-2">Enter your email address to receive a recovery link</p>
    </div>

    <!-- Forgot Password Card -->
    <div class="bg-[#171717] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-xl shadow-black/40">
      
      <!-- Input State -->
      <form id="forgotForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email Address</label>
          <input type="email" id="email" required
                 class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
                 placeholder="your@email.com">
        </div>
        
        <div id="forgotError" class="text-red-400 text-sm hidden flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="errorText"></span>
        </div>

        <button type="submit" id="submitBtn"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 relative overflow-hidden group shadow-lg shadow-blue-600/20">
          <span id="btnText">Send Recovery Link</span>
          <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Success State (hidden by default) -->
      <div id="successState" class="hidden text-center py-4 space-y-4">
        <div class="w-12 h-12 bg-green-950/50 border border-green-800 rounded-full flex items-center justify-center mx-auto text-green-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-white">Check your email</h3>
          <p class="text-gray-400 text-sm mt-2 leading-relaxed">
            If an account exists with <span id="successEmail" class="text-blue-400 font-medium"></span>, you will receive a password reset link shortly.
          </p>
        </div>
      </div>

    </div>

    <!-- Back to login -->
    <div class="mt-6 text-center">
      <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors duration-200 flex items-center justify-center gap-1.5 group">
        <svg class="w-4 h-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Back to Sign In</span>
      </a>
    </div>

  </div>

  <script>
    document.getElementById('forgotForm').onsubmit = async (e) => {
      e.preventDefault();
      
      const emailInput = document.getElementById('email');
      const errEl = document.getElementById('forgotError');
      const errText = document.getElementById('errorText');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const successState = document.getElementById('successState');
      const successEmail = document.getElementById('successEmail');
      const forgotForm = document.getElementById('forgotForm');
      
      errEl.classList.add('hidden');
      
      // Client-side validation
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        errText.textContent = 'Please enter a valid email address.';
        errEl.classList.remove('hidden');
        return;
      }
      
      // Start loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Sending...';
      spinner.classList.remove('hidden');
      
      // Simulate network latency (Work in Progress feature)
      setTimeout(() => {
        // Transition to success state
        forgotForm.classList.add('hidden');
        successEmail.textContent = email;
        successState.classList.remove('hidden');
      }, 1500);
    };
  </script>
</body>
</html>
