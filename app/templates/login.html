<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG KB — Login</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="min-h-dvh flex items-center justify-center bg-[#0f0f0f] text-gray-100">

  <div class="w-full max-w-md p-6 sm:p-8">
    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="mb-2"><svg class="w-10 h-10 mx-auto text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div>
      <h1 class="text-2xl font-bold text-white">RAG Knowledge Base</h1>
      <p class="text-gray-400 text-sm mt-1">Sign in to continue</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
        <input type="text" id="username" required
               class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
               placeholder="Enter your username">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-sm font-medium text-gray-300">Password</label>
          
        </div>
        <input type="password" id="password" required
               class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
               placeholder="Enter your password">
      </div>
      <div id="loginError" class="text-red-400 text-sm hidden"></div>
      <button type="submit" id="loginBtn"
              class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">
        Sign In
      </button>
    </form>

    <!-- Register toggle -->
    <div class="mt-6 text-center">
      <button id="toggleRegister" class="text-sm text-gray-400 hover:text-white transition">
        Don't have an account? <span class="text-blue-400">Sign up</span>
      </button>
      <br>
      <a href="/forgot-password" class="text-xs text-blue-400 hover:underline">Forgot password?</a>
    </div>

    <!-- Register Form (hidden by default) -->
    <form id="registerForm" class="space-y-4 hidden mt-6">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
        <input type="text" id="regUsername" required
               class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
               placeholder="Choose a username">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input type="email" id="regEmail" required
               class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
               placeholder="your@email.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input type="password" id="regPassword" required
               class="w-full px-4 py-3 bg-[#212121] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
               placeholder="Create a password">
      </div>
      <div id="regError" class="text-red-400 text-sm hidden"></div>
      <button type="submit"
              class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-colors">
        Create Account
      </button>
      <button type="button" id="backToLogin"
              class="w-full py-2 text-sm text-gray-400 hover:text-white transition">
        Back to Sign In
      </button>
    </form>
  </div>

  <script>
    const API = '';

    // Check if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/chat';
    }

    // Toggle forms
    document.getElementById('toggleRegister').onclick = () => {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    };
    document.getElementById('backToLogin').onclick = () => {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    };

    // Login
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('token', data.access_token);
        window.location.href = '/chat';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    };

    // Register
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');

      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');

        // Auto-login after registration
        const loginRes = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const loginData = await loginRes.json();
        if (loginRes.ok) {
          localStorage.setItem('token', loginData.access_token);
          window.location.href = '/chat';
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
